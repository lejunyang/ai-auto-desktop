name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_windows_native:
        description: "运行 Rust Windows UIA 原生 fixture"
        required: false
        default: false
        type: boolean

jobs:
  # The Rust workspace is the shipped implementation, so it is built and tested
  # on every platform it supports. aad-gui is excluded: it needs the Tauri
  # system libraries (GTK/WebKit on Linux) and is never published, so its build
  # is covered by the release workflow's installer job on Windows instead.
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Branch refs default to the latest osdk release; explicit for clarity.
      # Rust and its components remain pinned by osdk.toml/osdk.lock.
      - uses: lejunyang/one-sdk@main
        with:
          version: latest
          install-deps: false
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        id: python
        with:
          python-version: "3.11"
      - name: Pin the optional script interpreter
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "AAD_SCRIPT_PYTHON=${{ steps.python.outputs.python-path }}" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Enforce the single Rust implementation
        shell: bash
        run: |
          set -euo pipefail
          test ! -f pyproject.toml
          # Windows hardware probes and the X11 assist check are test
          # harnesses, not a second shipped implementation. Keep them, while
          # still rejecting Python elsewhere.
          if git ls-files '*.py' '*.pyi' ':!:tests/windows/*.py' ':!:tests/linux/*.py' | grep -q .; then
            echo "tracked Python implementation files remain" >&2
            git ls-files '*.py' '*.pyi' ':!:tests/windows/*.py' ':!:tests/linux/*.py' >&2
            exit 1
          fi
      - name: Check retained Windows hardware probes
        if: runner.os == 'Windows'
        run: python -m compileall -q tests/windows tests/linux
      - name: Install Linux native driver test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb xauth dbus-x11 at-spi2-core g++ pkg-config qtbase5-dev libx11-dev libxtst-dev openbox x11-utils xclip tesseract-ocr tesseract-ocr-eng
      - name: Build Linux native input and capture helpers
        if: runner.os == 'Linux'
        run: |
          plugins/linux_atspi/build_x11_xtest_helper.sh
          plugins/linux_atspi/build_x11_capture_helper.sh
      - name: Build production macOS AX helper
        if: runner.os == 'macOS'
        run: plugins/macos_ax/build.sh
      - name: Smoke Rust adapter against the signed macOS AX helper
        if: runner.os == 'macOS'
        run: cargo run --locked -q -p aad-macos-ax --example list_apps
      - name: Exercise the Rust macOS result verifier
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          result_root="$(mktemp -d)"
          trap 'rm -rf -- "$result_root"' EXIT
          status=0
          tests/macos/run.sh --output "$result_root" --build-dir "$result_root/build" || status=$?
          [ "$status" -eq 3 ]
          archive="$(find "$result_root" -type f -name macos-ax-test-result.tar.gz -print -quit)"
          [ -n "$archive" ]
          verify_status=0
          cargo run --locked -q -p aad-macos-ax \
            --bin aad-macos-result-verifier -- "$archive" || verify_status=$?
          [ "$verify_status" -eq 1 ]

      - name: Check formatting
        run: cargo fmt --all --check

      # --locked so a Cargo.lock that no longer matches the manifests fails
      # here rather than in the middle of a release.
      - name: Build and test the workspace
        run: cargo test --workspace --exclude aad-gui --locked
      - name: Test the Rust subprocess plugin fixture
        run: cargo test --locked -p aad-plugin --features test-fixture --test process_plugin

      - name: Test browser control with isolated sandboxed Chromium
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          export AAD_TEST_CHROME="$(command -v google-chrome || command -v chromium)"
          test -n "$AAD_TEST_CHROME"
          cargo test --locked -p aad-control --test browser_e2e -- --ignored

      # aad assist on the macOS desktop: the displays are listed, and a
      # viewer gets a first picture, or, where the runner grants no Screen
      # Recording, the error that says so. Input needs Accessibility, which a
      # runner may not grant either, so only what it reports is printed.
      - name: Smoke assist on the macOS desktop
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p aad-cli
          python3 - <<'PY'
          import base64, json, os, socket, subprocess, sys, time
          aad = "target/debug/aad"
          screens = json.loads(subprocess.run([aad, "--compact", "assist", "--list-screens"], capture_output=True, text=True).stdout)
          print("screens", screens)
          assert screens["monitors"], "no display listed"
          p = subprocess.Popen([aad, "--compact", "assist", "--desktop", "--view-only", "--codecs", "tiles"], stdout=subprocess.PIPE, text=True)
          try:
              announce = json.loads(p.stdout.readline())
              print("source", announce["source"])
              assert announce["source"]["capture"] == "coregraphics"
              host, rest = announce["websocket"][len("ws://"):].split("/", 1)
              address, port = host.split(":")
              s = socket.create_connection((address, int(port)), timeout=20)
              key = base64.b64encode(os.urandom(16)).decode()
              s.sendall(f"GET /{rest} HTTP/1.1\r\nHost: {host}\r\nUpgrade: websocket\r\nConnection: Upgrade\r\nSec-WebSocket-Key: {key}\r\nSec-WebSocket-Version: 13\r\n\r\n".encode())
              head = b""
              while b"\r\n\r\n" not in head:
                  head += s.recv(1)
              payload = json.dumps({"type": "hello", "accept": ["tiles"]}).encode()
              mask = os.urandom(4)
              s.sendall(bytes([0x81, 0x80 | len(payload)]) + mask + bytes(b ^ mask[i % 4] for i, b in enumerate(payload)))
              def exact(n):
                  data = b""
                  while len(data) < n:
                      chunk = s.recv(n - len(data))
                      assert chunk, "connection closed"
                      data += chunk
                  return data
              deadline = time.time() + 30
              outcome = None
              while time.time() < deadline and outcome is None:
                  first, second = exact(2)
                  length = second & 0x7F
                  if length == 126:
                      length = int.from_bytes(exact(2), "big")
                  elif length == 127:
                      length = int.from_bytes(exact(8), "big")
                  data = exact(length)
                  if first & 0x0F == 2 and data[1] == 6:
                      outcome = ("picture", int.from_bytes(data[4:8], "big"), int.from_bytes(data[8:12], "big"))
                  elif first & 0x0F == 1:
                      message = json.loads(data)
                      if message.get("type") == "error":
                          outcome = ("error", message["message"])
              print("outcome", outcome)
              assert outcome and (outcome[0] == "picture" or "Screen Recording" in outcome[1]), outcome
          finally:
              p.terminate()
          PY

      # Where the runner grants Accessibility, input is checked by its
      # effect: the pointer lands where a viewer points (as the system
      # reports it); text typed into TextEdit and saved with Cmd+S through
      # assist is the file's text, Cmd+A then typing replaces it, and Cmd+A
      # Cmd+C puts it where pbpaste reads it. No AppleScript: a runner does
      # not grant Automation of other apps.
      - name: Check assist input on the macOS desktop
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/assist-note.txt
          open -a TextEdit /tmp/assist-note.txt
          sleep 3
          PYTHONPATH=tests/windows python3 - <<'PY'
          import json, queue, subprocess, sys, time
          import verify_assist
          verify_assist.AAD = "target/debug/aad"
          from verify_assist import Viewer, start_assist
          from verify_assist_video import listen
          assist, announce = start_assist("--desktop", "--codecs", "tiles")
          try:
              if not announce["source"]["permissions"]["accessibility"]:
                  print("no Accessibility on this runner; input not checked")
                  sys.exit(0)
              viewer = listen(Viewer(announce["websocket"]))
              viewer.send({"type": "hello", "accept": ["tiles"]})
              def cursor_near(x, y, seconds=5):
                  end = time.time() + seconds
                  while time.time() < end:
                      try:
                          m = viewer.inbox.get(timeout=0.2)
                      except queue.Empty:
                          continue
                      if m and m.get("type") == "cursor" and abs(m["x"] - x) < 0.01 and abs(m["y"] - y) < 0.01:
                          return True
                  return False
              def chord(code, key):
                  viewer.send({"type": "key", "action": "down", "key": "Meta", "code": "MetaLeft"})
                  viewer.send({"type": "key", "action": "down", "key": key, "code": code})
                  viewer.send({"type": "key", "action": "up", "key": key, "code": code})
                  viewer.send({"type": "key", "action": "up", "key": "Meta", "code": "MetaLeft"})
                  time.sleep(0.5)
              def saved():
                  chord("KeyS", "s")
                  time.sleep(1)
                  return open("/tmp/assist-note.txt").read()
              def copied():
                  chord("KeyA", "a")
                  chord("KeyC", "c")
                  return subprocess.run(["pbpaste"], capture_output=True, text=True, timeout=10).stdout
              viewer.send({"type": "mouse", "action": "move", "x": 0.25, "y": 0.75})
              pointer = cursor_near(0.25, 0.75)
              viewer.send({"type": "text", "text": "typed through assist"})
              time.sleep(1)
              typed = saved()
              chord("KeyA", "a")
              viewer.send({"type": "text", "text": "replaced"})
              time.sleep(1)
              replaced = saved()
              clipboard = copied()
              viewer.close()
              # TextEdit capitalises the first letter of a sentence.
              result = {"pointer_lands": pointer, "typed": typed, "cmd_a_then_typing": replaced,
                        "cmd_a_cmd_c_copies": clipboard}
              print(json.dumps(result))
              assert pointer and typed.lower() == "typed through assist" and replaced.lower() == "replaced", result
              assert clipboard == replaced, result
          finally:
              assist.terminate()
              subprocess.run(["pkill", "-x", "TextEdit"])
          PY

      # aad assist on an X11 desktop of its own (the script starts Xvfb):
      # what is streamed and what a viewer's input does, checked by effect.
      - name: Test assist on an X11 desktop
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends xdotool x11-xserver-utils
          python3 -m venv /tmp/assist-venv
          /tmp/assist-venv/bin/pip install --quiet pillow
          cargo build --locked -p aad-cli
          /tmp/assist-venv/bin/python tests/linux/verify_assist_desktop.py

      # The UIA research probes call Win32 APIs directly. They are excluded
      # from automatic example discovery on other hosts, but still need to be
      # compile-checked where those APIs exist.
      - name: Check Windows-native UIA examples
        if: runner.os == 'Windows'
        run: cargo check --locked -p aad-uia --examples --features windows-native-examples

      - name: Run Rust Windows UIA fixture
        if: >-
          runner.os == 'Windows' &&
          ((github.event_name == 'workflow_dispatch' && inputs.run_windows_native == true) ||
           (github.event_name == 'push' && contains(github.event.head_commit.message, '[windows-native]')))
        run: cargo test --locked -p aad-uia --test windows_native -- --ignored

      # -D warnings, or clippy prints a warning and still exits 0, which makes
      # the step decorative.
      - name: Lint
        run: cargo clippy --workspace --exclude aad-gui --locked --all-targets -- -D warnings
      - name: Lint the Rust subprocess plugin fixture
        run: cargo clippy --locked -p aad-plugin --features test-fixture --all-targets -- -D warnings

      # The Rust CLI is what users actually get, so examples are validated
      # through the same binary shipped to users.
      #
      # Enumerated from git rather than hardcoded, so an example added later is
      # covered without anyone remembering to extend this list.
      - name: Validate tracked examples through the Rust CLI
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for descriptor in $(git ls-files 'examples/workflows/*.yaml' 'examples/workflows/*.json'); do
            echo "validating ${descriptor}"
            cargo run --locked -p aad-cli -- validate "${descriptor}"
            count=$((count + 1))
          done
          if [ "${count}" -eq 0 ]; then
            echo "no tracked example descriptors found -- the glob above is wrong" >&2
            exit 1
          fi
          echo "validated ${count} tracked example descriptor(s)"

      - name: Smoke capability probe through the Rust CLI
        run: cargo run --locked -p aad-cli -- probe

      - name: Run Rust Linux AT-SPI fixture
        if: runner.os == 'Linux'
        run: tests/linux/run-rust-atspi-fixture.sh

      # Capture, Tesseract OCR, paste, clipboard, global keys, EWMH window
      # actions and launch, each checked by its effect, with openbox as the
      # window manager in a private Xvfb session.
      - name: Run Linux desktop parity fixture
        if: runner.os == 'Linux'
        run: tests/linux/run-linux-parity.sh
