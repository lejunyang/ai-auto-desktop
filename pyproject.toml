[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

# NOT PUBLISHED. This package is kept installable for local development only:
# the Rust workspace is the shipped implementation, while `plugins/` (macOS AX,
# Linux AT-SPI, OCR) still imports `ai_auto_desktop.artifact_ipc` and the 58
# Python test files remain the behavioural reference for unported semantics.
# `Private :: Do Not Upload` makes PyPI reject an upload outright, so an
# accidental `twine upload` fails instead of publishing a package nobody should
# depend on. See docs/plan/rust-port-status.md for what is still unported.
[project]
name = "ai-auto-desktop"
classifiers = ["Private :: Do Not Upload"]
version = "0.0.1"
description = "A strict, process-isolated desktop automation workflow runtime"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "ai-auto-desktop contributors" }]
dependencies = ["PyYAML>=6.0", "jsonschema>=4.18", "Pillow>=9.0"]

[project.optional-dependencies]
ocr = ["Pillow>=9.0"]
windows-uia = ["comtypes>=1.4,<2"]

[project.scripts]
ai-auto-desktop = "ai_auto_desktop.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_auto_desktop = [
    "schemas/workflow/v1alpha1/workflow.schema.json",
    "schemas/capabilities/v1alpha1/capability-manifest.schema.json",
    "schemas/runtime/v1alpha1/run.schema.json",
    "schemas/runtime/v1alpha1/event.schema.json",
    "schemas/runtime/v1alpha1/artifact-ref.schema.json",
]

