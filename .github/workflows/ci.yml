name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_windows_native:
        description: "运行 Windows UIA 原生 fixture"
        required: false
        default: false
        type: boolean

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
            install-target: .
          - os: macos-latest
            python-version: "3.11"
            install-target: .
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and contract test dependencies
        run: python -m pip install wheel "${{ matrix.install-target }}[ocr]"
      - name: Install Linux X11 capture test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libx11-dev pkg-config g++
      - name: Run contract tests
        run: python -m unittest discover -s tests -v
      - name: Build production macOS AX helper
        if: runner.os == 'macOS'
        run: plugins/macos_ax/build.sh
      - name: Build macOS AX fixture test kit
        if: runner.os == 'macOS'
        run: tests/macos/build.sh
      - name: Validate canonical example
        if: success()
        run: python -m ai_auto_desktop validate examples/workflows/ocr-error-response.json
      - name: Gate tracked workflow examples
        if: success()
        run: python -m unittest tests.test_examples -v
      - name: Smoke capability probe
        if: success()
        run: python -m ai_auto_desktop probe

  windows-contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and Windows contract dependencies
        run: python -m pip install wheel ".[ocr,windows-uia]"
      - name: Run Windows ArtifactStore and named-pipe contracts
        run: >-
          python -m unittest -v
          tests.test_artifacts
          tests.test_artifact_ipc
          tests.test_windows_artifact_pipe_contract
          tests.test_plugin_artifact_transport
          tests.test_runtime_artifacts
          tests.test_ocr_plugin
          tests.test_package_resources
      - name: Run portable Windows driver and runtime contracts
        run: >-
          python -m unittest -v
          tests.test_plugin
          tests.test_runtime
          tests.test_windows_uia_driver
          tests.test_windows_uia_capture
          tests.test_recording_compiler
          tests.test_recording_editor
      - name: Run Windows kernel confinement contracts
        run: >-
          python -m unittest -v
          tests.test_windows_job_supervisor
          tests.test_windows_script_sandbox
          tests.test_windows_probe
          tests.test_script_contracts
          tests.test_probe
      - name: Validate canonical example
        if: success()
        run: python -m ai_auto_desktop validate examples/workflows/ocr-error-response.json
      - name: Gate tracked workflow examples
        if: success()
        run: python -m unittest tests.test_examples -v
      - name: Smoke capability probe
        if: success()
        run: python -m ai_auto_desktop probe

  windows-native:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.run_windows_native == true) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[windows-native]'))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project with Windows UIA support
        run: python -m pip install ".[windows-uia]"
      - name: Run Windows native fixture and write result
        id: windows-native-fixture
        shell: pwsh
        run: ./tests/windows/run-native-fixture.ps1 -OutputPath artifacts/windows-native-fixture-result.json
      - name: Upload Windows native fixture result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-fixture-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/windows-native-fixture-result.json
          if-no-files-found: error
          retention-days: 30
      - name: Validate canonical example
        if: success()
        run: python -m ai_auto_desktop validate examples/workflows/ocr-error-response.json
      - name: Gate tracked workflow examples
        if: success()
        run: python -m unittest tests.test_examples -v
      - name: Smoke capability probe
        if: success()
        run: python -m ai_auto_desktop probe
