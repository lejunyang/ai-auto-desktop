name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_windows_native:
        description: "运行 Windows UIA 原生 fixture"
        required: false
        default: false
        type: boolean

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
            install-target: .
          - os: macos-latest
            python-version: "3.11"
            install-target: .
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install "${{ matrix.install-target }}"
      - name: Run contract tests
        run: python -m unittest discover -s tests -v
      - name: Build macOS AX fixture test kit
        if: runner.os == 'macOS'
        run: tests/macos/build.sh
      - name: Validate canonical example
        if: success()
        run: python -m ai_auto_desktop validate examples/workflows/ocr-error-response.json
      - name: Gate tracked workflow examples
        if: success()
        run: python -m unittest tests.test_examples -v
      - name: Smoke capability probe
        if: success()
        run: python -m ai_auto_desktop probe

  windows-native:
    if: github.event_name == 'workflow_dispatch' && inputs.run_windows_native == true
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project with Windows UIA support
        run: python -m pip install ".[windows-uia]"
      - name: Run Windows native fixture and write result
        id: windows-native-fixture
        shell: pwsh
        run: ./tests/windows/run-native-fixture.ps1 -OutputPath artifacts/windows-native-fixture-result.json
      - name: Upload Windows native fixture result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-fixture-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/windows-native-fixture-result.json
          if-no-files-found: error
          retention-days: 30
      - name: Validate canonical example
        if: success()
        run: python -m ai_auto_desktop validate examples/workflows/ocr-error-response.json
      - name: Gate tracked workflow examples
        if: success()
        run: python -m unittest tests.test_examples -v
      - name: Smoke capability probe
        if: success()
        run: python -m ai_auto_desktop probe
