[package]
name = "aad-probe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Read-only capability probes for desktop automation prerequisites"

[dependencies]
aad-platform = { workspace = true }
aad-plugin = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(windows)'.dependencies]
aad-windows = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
aad-linux = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
aad-macos = { workspace = true }

# Inherit the workspace's deliberate lint allowances (see the root Cargo.toml).
[lints]
workspace = true
