[package]
name = "aad-plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "NDJSON subprocess plugin host for ai-auto-desktop"
autobins = false

[features]
test-fixture = []

[dependencies]
aad-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
] }

[dev-dependencies]
serde_json = { workspace = true }

# Inherit the workspace's deliberate lint allowances (see the root Cargo.toml).
[lints]
workspace = true

[[bin]]
name = "aad-plugin-fixture"
path = "src/bin/aad-plugin-fixture.rs"
required-features = ["test-fixture"]
test = false
bench = false

[[test]]
name = "process_plugin"
path = "tests/process_plugin.rs"
required-features = ["test-fixture"]
