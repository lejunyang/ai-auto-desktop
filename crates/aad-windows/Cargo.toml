[package]
name = "aad-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "What Windows offers ai-auto-desktop including UI Automation: screen capture, input, clipboard; built on Windows only"

[target.'cfg(windows)'.dependencies]
aad-desktop = { workspace = true }
windows-core = "0.58"
aad-platform = { workspace = true }
base64 = "0.22"
image = { workspace = true }
serde_json = { workspace = true }
windows = { version = "0.58", features = [
    "implement",
    "Win32_System_LibraryLoader",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_UI_Input_Ime",
    # Windows' built-in OCR.
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
# The probe's checks read the process token and display state.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_SystemInformation",
    "Win32_System_RemoteDesktop",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

# Inherit the workspace's deliberate lint allowances (see the root Cargo.toml).
[lints]
workspace = true

[features]
# These executables are investigation tools that call Win32/UIA APIs directly.
# Keeping them behind an explicit feature prevents Cargo's automatic example
# discovery from trying to build Windows binaries on Linux and macOS. CI turns
# the feature on in its Windows job so they are still compilation-checked.
windows-native-examples = []

[target.'cfg(windows)'.dev-dependencies]
aad-core = { workspace = true }
aad-runtime = { workspace = true }
base64 = "0.22"
image = { workspace = true }
uuid = { workspace = true }

