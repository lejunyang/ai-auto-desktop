[tools]
rust = { version = "1.98.0", components = "rustfmt,clippy" }

# These tasks use released osdk semantics. CI installs the latest release via
# the official one-sdk Action. Native GUI fixtures remain
# explicit: they require a display and platform development packages.
[tasks]
fmt = "cargo fmt --all"
fmt-check = "cargo fmt --all --check"
test = "cargo test --workspace --exclude aad-gui --locked"
clippy = "cargo clippy --workspace --exclude aad-gui --locked --all-targets -- -D warnings"
plugin-test = "cargo test --locked -p aad-plugin --features test-fixture --test process_plugin"
control-test = "cargo test --locked -p aad-control -p aad-cdp -p aad-mcp -p aad-cli"
probe = "cargo run --locked -p aad-cli -- probe"

[tasks.ci]
depends = ["fmt-check", "clippy", "plugin-test"]
run = "cargo test --workspace --exclude aad-gui --locked"
