[package]
name = "aad-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Command line interface for ai-auto-desktop"

[[bin]]
name = "aad"
path = "src/main.rs"

[dependencies]
aad-core = { workspace = true }
aad-control = { workspace = true }
aad-mcp = { workspace = true }
aad-ocr = { workspace = true }
aad-atspi = { workspace = true }
aad-macos-ax = { workspace = true }
aad-plugin = { workspace = true }
aad-probe = { workspace = true }
aad-runtime = { workspace = true }
aad-uia = { workspace = true }
aad-cdp = { workspace = true }
clap = { workspace = true }
shlex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
ctrlc = { version = "3.5", features = ["termination"] }
uuid = { workspace = true }
sha1 = "0.10"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
image = { workspace = true }
# Lossy WebP for the desktop stream (libwebp, built from source).
webp = { version = "0.3", default-features = false }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# Inherit the workspace's deliberate lint allowances (see the root Cargo.toml).
[lints]
workspace = true
