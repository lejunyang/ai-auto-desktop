name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
            install-target: .
          - os: windows-latest
            python-version: "3.11"
            install-target: .[windows-uia]
          - os: macos-latest
            python-version: "3.11"
            install-target: .
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install "${{ matrix.install-target }}"
      - name: Run contract tests
        run: python -m unittest discover -s tests -v
      - name: Validate canonical example
        run: python -m ai_auto_desktop validate examples/workflows/ocr-error-response.json
      - name: Smoke capability probe
        run: python -m ai_auto_desktop probe
