[package]
name = "aad-uia"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Windows UI Automation backend for the ai-auto-desktop driver; built on Windows only"

[features]
# These executables are investigation tools that call Win32/UIA APIs directly.
# Keeping them behind an explicit feature prevents Cargo's automatic example
# discovery from trying to build Windows binaries on Linux and macOS. CI turns
# the feature on in its Windows job so they are still compilation-checked.
windows-native-examples = []

[target.'cfg(windows)'.dependencies]
aad-desktop = { workspace = true }
aad-platform = { workspace = true }
aad-windows = { workspace = true }
serde_json = { workspace = true }
# The #[implement] macro expands to `windows_core::` paths and resolves them at
# the crate root, so windows-core has to be a dependency in its own right --
# a `use windows::core as windows_core` alias does not satisfy it.
windows-core = "0.58"
windows = { version = "0.58", features = [
    # Lets the recorder implement UIA's callback interfaces, which is how
    # events are delivered: UIA calls into objects we hand it.
    "implement",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Ime",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Dwm",
    "Win32_System_StationsAndDesktops",
] }

# The native tests and the investigation examples drive whole workflows.
[target.'cfg(windows)'.dev-dependencies]
aad-core = { workspace = true }
aad-runtime = { workspace = true }
base64 = "0.22"
image = { workspace = true }
uuid = { workspace = true }

# Inherit the workspace's deliberate lint allowances (see the root Cargo.toml).
[lints]
workspace = true

