name: Release

# Triggered by a commit landing on main whose message contains [publish].
#
# Why the commit message and not a tag: the version already lives in
# [workspace.package], so a tag would be a second place to keep in sync and
# could disagree with the manifest. The `gate` job reads the version out of
# Cargo.toml and refuses to run when that version is already published or
# already tagged, which is the check a tag would otherwise stand in for.
#
# Python is deliberately not published. The Rust workspace is the shipped
# implementation; the Python tree is kept as the behavioural reference for
# unported semantics and as the import target for the plugins under plugins/.
# See docs/plan/rust-port-status.md.
on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Gate. Everything downstream needs this, so a commit without [publish] costs
  # one short job instead of a matrix of release builds.
  # ---------------------------------------------------------------------------
  gate:
    if: contains(github.event.head_commit.message, '[publish]')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the version from the workspace manifest
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; pkgs=json.load(sys.stdin)["packages"]; print(next(p["version"] for p in pkgs if p["name"]=="aad-core"))')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "releasing v$version"

      - name: Refuse a version that is already on crates.io
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.version }}'
          # aad-core is published first, so it decides whether this version is
          # taken. crates.io versions are immutable: re-releasing a published
          # version cannot succeed, and failing here says so before anything is
          # built or uploaded.
          code="$(curl -sS -o /tmp/core.json -w '%{http_code}' \
            -H 'User-Agent: ai-auto-desktop-release' \
            https://crates.io/api/v1/crates/aad-core || true)"
          if [ "$code" = "404" ]; then
            echo "aad-core is not on crates.io yet; this is the first release"
            exit 0
          fi
          if [ "$code" != "200" ]; then
            echo "crates.io returned HTTP $code; refusing to guess" >&2
            exit 1
          fi
          if python3 -c 'import json,sys; data=json.load(open("/tmp/core.json")); sys.exit(0 if any(v["num"]==sys.argv[1] for v in data.get("versions",[])) else 1)' "$version"
          then
            echo "aad-core $version is already published; bump the version first" >&2
            exit 1
          fi
          echo "$version is free on crates.io"

      - name: Refuse a version that is already tagged
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.version }}'
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "tag v$version already exists; bump the version first" >&2
            exit 1
          fi
          echo "tag v$version is free"

  # ---------------------------------------------------------------------------
  # Tests. A release must not be the first time the Rust code is compiled and
  # tested. ci.yml only exercises the Python tree, so the Rust suite runs here.
  # ---------------------------------------------------------------------------
  test:
    needs: gate
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # aad-gui pulls in the Tauri system libraries, which are irrelevant to the
      # crates being published. It is excluded rather than installing GTK/WebKit
      # on every runner just to compile a shell that is never published.
      - name: Build and test the publishable crates
        run: cargo test --workspace --exclude aad-gui --locked

      - name: Reject a Cargo.lock that the manifests no longer agree with
        run: cargo metadata --locked --format-version 1 > /dev/null

  # ---------------------------------------------------------------------------
  # Release binaries. Built per target and uploaded as artifacts; the release
  # job attaches them once every target has succeeded, so a failure on one
  # platform cannot produce a half-populated GitHub Release.
  # ---------------------------------------------------------------------------
  binaries:
    needs: [gate, test]
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build the aad binary
        run: cargo build --release --locked -p aad-cli --target ${{ matrix.target }}

      - name: Install Linux helper build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++ pkg-config libx11-dev libxtst-dev

      - name: Build Linux native input and capture helpers
        if: runner.os == 'Linux'
        run: |
          plugins/linux_atspi/build_x11_xtest_helper.sh
          plugins/linux_atspi/build_x11_capture_helper.sh

      - name: Build macOS AX helper
        if: runner.os == 'macOS'
        run: plugins/macos_ax/build.sh

      # Packaged as an archive rather than a bare binary so the executable bit
      # survives the download on Unix, and named with the target so four
      # uploads cannot collide on one release.
      - name: Package the binary
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.gate.outputs.version }}'
          target='${{ matrix.target }}'
          staging="aad-$version-$target"
          mkdir -p "dist/$staging"
          if [ '${{ runner.os }}' = 'Windows' ]; then
            cp "target/$target/release/aad.exe" "dist/$staging/"
          else
            cp "target/$target/release/aad" "dist/$staging/"
            if [ '${{ runner.os }}' = 'Linux' ]; then
              cp plugins/linux_atspi/.build/x11_xtest_helper "dist/$staging/aad-linux-xtest-helper"
              cp plugins/linux_atspi/.build/x11_capture_helper "dist/$staging/aad-linux-capture-helper"
            fi
            if [ '${{ runner.os }}' = 'macOS' ]; then
              cp -R plugins/macos_ax/.build/MacOSAXHelper.app "dist/$staging/"
            fi
          fi
          cp README.md "dist/$staging/"
          cd dist
          if [ '${{ runner.os }}' = 'Windows' ]; then
            7z a -tzip "$staging.zip" "$staging" > /dev/null
            echo "asset=dist/$staging.zip" >> "$GITHUB_OUTPUT"
          else
            tar -czf "$staging.tar.gz" "$staging"
            echo "asset=dist/$staging.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      # Verified by running the binary that is about to ship, because a build
      # that links but reports the wrong version would otherwise be released.
      # Skipped when cross-compiling, where the host cannot execute the output.
      - name: Check the built binary reports the release version
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.gate.outputs.version }}'
          if [ '${{ runner.os }}' = 'Windows' ]; then
            actual="$(./target/${{ matrix.target }}/release/aad.exe --version)"
          else
            actual="$(./target/${{ matrix.target }}/release/aad --version)"
          fi
          echo "binary reports: $actual"
          [ "$actual" = "aad $version" ]

      - uses: actions/upload-artifact@v4
        with:
          name: aad-${{ matrix.target }}
          path: ${{ steps.package.outputs.asset }}
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Windows GUI installers. Separate from `binaries` because only Windows is
  # configured as a bundle target (msi, nsis) in tauri.conf.json, and because a
  # missing installer must not block the CLI release.
  # ---------------------------------------------------------------------------
  installer:
    needs: [gate, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: tauri-windows
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Install the front-end dependencies
        working-directory: gui
        run: npm ci

      - name: Test the front end
        working-directory: gui
        run: npm test

      - name: Build the installers
        working-directory: gui
        run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: aad-gui-windows-installers
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # crates.io. Runs before the GitHub Release: a publish is irreversible, so if
  # it fails the release should not exist yet. `--workspace` resolves the
  # dependency order itself and waits for each crate to become available, which
  # hand-ordered `cargo publish` calls plus sleeps only approximate.
  # aad-gui carries publish = false and is skipped automatically.
  # ---------------------------------------------------------------------------
  crates:
    needs: [gate, test, binaries, installer]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Dry-run the publish
        run: cargo publish --workspace --locked --dry-run
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish to crates.io
        run: cargo publish --workspace --locked --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ---------------------------------------------------------------------------
  # GitHub Release. Last, so it only appears once the crates are published and
  # every artifact exists.
  # ---------------------------------------------------------------------------
  release:
    needs: [gate, binaries, installer, crates]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List what will be attached
        shell: bash
        run: |
          set -euo pipefail
          find artifacts -type f -printf '%p (%s bytes)\n' | sort
          # An empty release would otherwise be published silently.
          [ "$(find artifacts -type f | wc -l)" -gt 0 ]

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.gate.outputs.version }}
          name: v${{ needs.gate.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: |
            Released from ${{ github.sha }}.

            **crates.io** — `aad-core`, `aad-plugin`, `aad-runtime`, `aad-ocr`,
            `aad-atspi`, `aad-macos-ax`, `aad-probe`, `aad-uia`, `aad-mcp`,
            `aad-cli` at `${{ needs.gate.outputs.version }}`.

            **CLI** — `aad` for Linux (x86_64), Windows (x86_64) and macOS
            (aarch64, x86_64). Unpack the archive for your platform.

            **GUI** — Windows `.msi` and NSIS `.exe` installers.

            Install the CLI from crates.io with `cargo install aad-cli`.
          files: artifacts/**/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
