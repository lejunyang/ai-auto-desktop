[package]
name = "aad-uia"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Native Windows UI Automation driver: app discovery, UI description and automation"

[features]
# These executables are investigation tools that call Win32/UIA APIs directly.
# Keeping them behind an explicit feature prevents Cargo's automatic example
# discovery from trying to build Windows binaries on Linux and macOS. CI turns
# the feature on in its Windows job so they are still compilation-checked.
windows-native-examples = []

[dependencies]
aad-core = { workspace = true }
aad-plugin = { workspace = true }
aad-runtime = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true }

[target.'cfg(windows)'.dependencies]
# The #[implement] macro expands to `windows_core::` paths and resolves them at
# the crate root, so windows-core has to be a dependency in its own right --
# a `use windows::core as windows_core` alias does not satisfy it.
windows-core = "0.58"
windows = { version = "0.58", features = [
    # Lets the recorder implement UIA's callback interfaces, which is how
    # events are delivered: UIA calls into objects we hand it.
    "implement",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
] }

# Inherit the workspace's deliberate lint allowances (see the root Cargo.toml).
[lints]
workspace = true

[[example]]
name = "capture_fields"
required-features = ["windows-native-examples"]

[[example]]
name = "capture_probe"
required-features = ["windows-native-examples"]

[[example]]
name = "spike_compare"
required-features = ["windows-native-examples"]

[[example]]
name = "spike_events"
required-features = ["windows-native-examples"]

[[example]]
name = "spike_identity"
required-features = ["windows-native-examples"]

[[example]]
name = "spike_listen"
required-features = ["windows-native-examples"]

[[example]]
name = "spike_which_events"
required-features = ["windows-native-examples"]

[[example]]
name = "spike_winevent"
required-features = ["windows-native-examples"]
