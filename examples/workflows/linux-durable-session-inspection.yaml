apiVersion: ai-auto-desktop.dev/v1alpha1
kind: Workflow
metadata:
  name: linux-durable-session-inspection
  version: 0.1.0
requires:
  platforms: [linux]
  permissions: [desktop.observe]
budgets:
  max_duration: 10s
  max_executed_steps: 2
  max_concurrency: 1
outputs:
  session:
    value: ${{ steps.inspect.output }}
steps:
  - id: inspect
    type: action
    uses: desktop.linux_atspi.inspect_session@1
    with: {}
    effect:
      class: read_only
    risk:
      category: observe
      level: low
    timeout: 5s
    attempt_timeout: 5s
    sensitivity:
      input: public
      output: public
      error: public
    checkpoint:
      output:
        mode: project
        fields: [backend, session_type, desktop]
