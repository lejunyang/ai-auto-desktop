[package]
name = "aad-gui"
version.workspace = true
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
description = "Desktop shell for composing and reviewing ai-auto-desktop recordings"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aad-uia = { path = "../../crates/aad-uia" }
aad-probe = { path = "../../crates/aad-probe" }
# The recordings store lives here so that the GUI, the CLI and the MCP server
# all read and write the same folder rather than each having its own idea of it.
aad-runtime = { path = "../../crates/aad-runtime" }
# Compiling a workflow before replaying it, so the editor can point at the step
# that needs fixing rather than reporting that something, somewhere, is wrong.
aad-core = { path = "../../crates/aad-core" }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = [] }

[features]
# Kept for parity with the Tauri template; the shell needs no custom protocol.
custom-protocol = ["tauri/custom-protocol"]
