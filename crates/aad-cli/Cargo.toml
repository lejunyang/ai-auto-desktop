[package]
name = "aad-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Command line interface for ai-auto-desktop"

[[bin]]
name = "aad"
path = "src/main.rs"

[dependencies]
aad-core = { workspace = true }
aad-control = { workspace = true }
aad-mcp = { workspace = true }
aad-ocr = { workspace = true }
aad-plugin = { workspace = true }
aad-probe = { workspace = true }
aad-runtime = { workspace = true }
aad-desktop = { workspace = true }
aad-browser = { workspace = true }
aad-platform = { workspace = true }
clap = { workspace = true }
shlex = { workspace = true }
csv = "1.4"
calamine = "0.38"
quick-xml = "0.42"
zip = { version = "9", default-features = false, features = ["deflate"] }
tempfile = "3"
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
ctrlc = { version = "3.5", features = ["termination"] }
uuid = { workspace = true }
# Locks the assist scratch folder of a running process.
fs2 = "0.4"
# Checksums of the zips an assist viewer downloads.
crc32fast = "1"
sha1 = "0.10"
base64 = "0.22"
image = { workspace = true }
# Lossy WebP for assist pictures (libwebp, built from source).
webp = { version = "0.3", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
aad-windows = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
aad-linux = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
aad-macos = { workspace = true }

# Inherit the workspace's deliberate lint allowances (see the root Cargo.toml).
[lints]
workspace = true
