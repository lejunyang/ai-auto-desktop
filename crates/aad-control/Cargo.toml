[package]
name = "aad-control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Session-scoped desktop and browser control with authenticated stdio transport"

[dependencies]
aad-core.workspace = true
aad-runtime.workspace = true
aad-plugin.workspace = true
aad-desktop.workspace = true
aad-cdp.workspace = true
aad-ocr.workspace = true
base64 = "0.22"
image.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
sha2.workspace = true
fs2 = "0.4"
libc.workspace = true
rqrr = { version = "0.10.1", default-features = false }

[target.'cfg(windows)'.dependencies]
aad-uia.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
aad-atspi.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
aad-macos-ax.workspace = true

[dev-dependencies]
qrcode = { version = "0.14.1", default-features = false }

# Real-desktop fixtures for the ignored Windows session tests.
[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true

[features]
qr-test-hooks = []
