name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_windows_native:
        description: "运行 Windows UIA 原生 fixture"
        required: false
        default: false
        type: boolean

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
            install-target: .
          - os: macos-latest
            python-version: "3.11"
            install-target: .
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and contract test dependencies
        run: python -m pip install wheel "${{ matrix.install-target }}[ocr]"
      - name: Install Linux X11 capture test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libx11-dev pkg-config g++
      - name: Run contract tests
        run: python -m unittest discover -s tests -v
      - name: Build production macOS AX helper
        if: runner.os == 'macOS'
        run: plugins/macos_ax/build.sh
      - name: Build macOS AX fixture test kit
        if: runner.os == 'macOS'
        run: tests/macos/build.sh
      - name: Validate canonical example
        if: success()
        run: python -m ai_auto_desktop validate examples/workflows/ocr-error-response.json
      - name: Gate tracked workflow examples
        if: success()
        run: python -m unittest tests.test_examples -v
      - name: Smoke capability probe
        if: success()
        run: python -m ai_auto_desktop probe

  windows-contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and Windows contract dependencies
        run: python -m pip install wheel ".[ocr,windows-uia]"
      - name: Run Windows ArtifactStore and named-pipe contracts
        run: >-
          python -m unittest -v
          tests.test_artifacts
          tests.test_artifact_ipc
          tests.test_windows_artifact_pipe_contract
          tests.test_plugin_artifact_transport
          tests.test_runtime_artifacts
          tests.test_ocr_plugin
          tests.test_package_resources
      - name: Run portable Windows driver and runtime contracts
        run: >-
          python -m unittest -v
          tests.test_plugin
          tests.test_runtime
          tests.test_windows_uia_driver
          tests.test_windows_uia_capture
          tests.test_recording_compiler
          tests.test_recording_editor
      - name: Run Windows kernel confinement contracts
        run: >-
          python -m unittest -v
          tests.test_windows_job_supervisor
          tests.test_windows_script_sandbox
          tests.test_windows_probe
          tests.test_script_contracts
          tests.test_probe
      - name: Validate canonical example
        if: success()
        run: python -m ai_auto_desktop validate examples/workflows/ocr-error-response.json
      - name: Gate tracked workflow examples
        if: success()
        run: python -m unittest tests.test_examples -v
      - name: Smoke capability probe
        if: success()
        run: python -m ai_auto_desktop probe

  windows-native:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.run_windows_native == true) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[windows-native]'))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project with Windows UIA support
        run: python -m pip install ".[windows-uia]"
      - name: Run Windows native fixture and write result
        id: windows-native-fixture
        shell: pwsh
        run: ./tests/windows/run-native-fixture.ps1 -OutputPath artifacts/windows-native-fixture-result.json
      - name: Upload Windows native fixture result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-fixture-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/windows-native-fixture-result.json
          if-no-files-found: error
          retention-days: 30
      - name: Validate canonical example
        if: success()
        run: python -m ai_auto_desktop validate examples/workflows/ocr-error-response.json
      - name: Gate tracked workflow examples
        if: success()
        run: python -m unittest tests.test_examples -v
      - name: Smoke capability probe
        if: success()
        run: python -m ai_auto_desktop probe
  # The Rust workspace is the shipped implementation, so it is built and tested
  # on every platform it supports. aad-gui is excluded: it needs the Tauri
  # system libraries (GTK/WebKit on Linux) and is never published, so its build
  # is covered by the release workflow's installer job on Windows instead.
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux native driver test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb xauth dbus-x11 at-spi2-core python3-gi gir1.2-gtk-3.0 g++ pkg-config libx11-dev libxtst-dev
      - name: Build Linux native input and capture helpers
        if: runner.os == 'Linux'
        run: |
          plugins/linux_atspi/build_x11_xtest_helper.sh
          plugins/linux_atspi/build_x11_capture_helper.sh

      - name: Check formatting
        run: cargo fmt --all --check

      # --locked so a Cargo.lock that no longer matches the manifests fails
      # here rather than in the middle of a release.
      - name: Build and test the workspace
        run: cargo test --workspace --exclude aad-gui --locked

      # The UIA research probes call Win32 APIs directly. They are excluded
      # from automatic example discovery on other hosts, but still need to be
      # compile-checked where those APIs exist.
      - name: Check Windows-native UIA examples
        if: runner.os == 'Windows'
        run: cargo check --locked -p aad-uia --examples --features windows-native-examples

      # -D warnings, or clippy prints a warning and still exits 0, which makes
      # the step decorative.
      - name: Lint
        run: cargo clippy --workspace --exclude aad-gui --locked --all-targets -- -D warnings

      # The Rust CLI is what users actually get, so examples are validated
      # through it as well: the Python jobs above only prove the Python tree
      # agrees with the tracked descriptors.
      #
      # Enumerated from git rather than hardcoded, so an example added later is
      # covered without anyone remembering to extend this list.
      - name: Validate tracked examples through the Rust CLI
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for descriptor in $(git ls-files 'examples/workflows/*.yaml' 'examples/workflows/*.json'); do
            echo "validating ${descriptor}"
            cargo run --locked -p aad-cli -- validate "${descriptor}"
            count=$((count + 1))
          done
          if [ "${count}" -eq 0 ]; then
            echo "no tracked example descriptors found -- the glob above is wrong" >&2
            exit 1
          fi
          echo "validated ${count} tracked example descriptor(s)"

      - name: Smoke capability probe through the Rust CLI
        run: cargo run --locked -p aad-cli -- probe

      - name: Run Rust Linux AT-SPI fixture
        if: runner.os == 'Linux'
        run: tests/linux/run-rust-atspi-fixture.sh
