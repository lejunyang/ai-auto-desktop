[package]
name = "aad-browser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Local browser protocol clients (Chromium CDP, Firefox WebDriver BiDi) and owned-browser lifecycle"

[features]
lifecycle-test-hooks = []

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json"] }
socket2 = "0.6"
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
sha1 = { version = "0.10", default-features = false }
base64 = "0.22"
uuid = { workspace = true }
sha2 = { workspace = true }
url = "2"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
fs2 = "0.4"
dunce = "1"
aad-platform.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
aad-linux.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
aad-macos.workspace = true

[target.'cfg(windows)'.dependencies]
aad-windows.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
